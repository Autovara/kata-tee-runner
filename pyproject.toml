[project]
name = "kata-tee-runner"
version = "0.1.0"
description = "Subnet-neutral confidential TEE runner for miner-funded agents."
requires-python = ">=3.12"
dependencies = [
  "coincurve==21.0.0",
  "dstack-sdk==0.5.4",
  "eciespy==0.4.6",
  "flask==3.1.3",
  "gunicorn==23.0.0",
]

[project.optional-dependencies]
seal = ["dcap-qvl==0.5.3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["room"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
